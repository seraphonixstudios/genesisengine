services:
  - type: web
    name: genesis-engine
    env: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: STABILITY_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGIN
        value: https://genesis-engine.onrender.com
    autoDeploy: true
    plan: free
    
databases:
  - name: genesis-engine-redis
    type: redis
    plan: free
    ipAllowList: []
